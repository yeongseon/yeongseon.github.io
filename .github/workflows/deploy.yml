name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build central site
        run: mkdocs build --strict

      - name: Stage tool docs
        run: ./scripts/stage-docs.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        if: github.ref == 'refs/heads/main'
        env:
          INDEXNOW_KEY: 13a6b7f182c884771301dd9dd99a2095
        run: |
          curl -sS -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"yeongseon.dev\",
              \"key\": \"${INDEXNOW_KEY}\",
              \"keyLocation\": \"https://yeongseon.dev/${INDEXNOW_KEY}.txt\",
              \"urlList\": [
                \"https://yeongseon.dev/\",
                \"https://yeongseon.dev/about/\",
                \"https://yeongseon.dev/azure-functions-python/\",
                \"https://yeongseon.dev/azure-functions-python/getting-started/\",
                \"https://yeongseon.dev/azure-functions-python/roadmap/\",
                \"https://yeongseon.dev/azure-functions-python/openapi/\",
                \"https://yeongseon.dev/azure-functions-python/validation/\",
                \"https://yeongseon.dev/azure-functions-python/scaffold/\",
                \"https://yeongseon.dev/azure-functions-python/logging/\",
                \"https://yeongseon.dev/azure-functions-python/doctor/\",
                \"https://yeongseon.dev/azure-functions-python/langgraph/\",
                \"https://yeongseon.dev/azure-functions-python/durable-graph/\",
                \"https://yeongseon.dev/azure-functions-python/knowledge/\",
                \"https://yeongseon.dev/azure-functions-python/db/\",
                \"https://yeongseon.dev/azure-functions-python/cookbook/\",
                \"https://yeongseon.dev/azure-functions-python/practical-guide/\"
              ]
            }" \
            -w "\nIndexNow HTTP %{http_code}\n"
