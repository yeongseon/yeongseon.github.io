<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yeongseon.dev</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0d10;
      color: #e6e8eb;
    }
    main { text-align: center; padding: 2rem; }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      margin: 0 0 0.5rem;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #6ea8fe, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { color: #9aa4af; font-size: 1.1rem; margin: 0 0 2rem; }
    nav { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    a {
      color: #e6e8eb;
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border: 1px solid #2a2f36;
      border-radius: 999px;
      transition: border-color .2s, color .2s;
    }
    a:hover { border-color: #6ea8fe; color: #6ea8fe; }
    footer { margin-top: 3rem; color: #5b636c; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>yeongseon.dev</h1>
    <p>Building things. Writing about Azure, Python, and software.</p>
    <nav>
      <a href="https://github.com/yeongseon">GitHub</a>
    </nav>
    <footer>&copy; <span id="y"></span> Yeongseon Choe</footer>
  </main>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
